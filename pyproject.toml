[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haru-life-events"
version = "0.1.0"
description = "MCP 2.0 Events service that wakes an AI agent when your location or Vitals change."
requires-python = ">=3.11"
dependencies = ["cryptography>=41,<51"]

[project.optional-dependencies]
server = ["uvicorn>=0.30,<1"]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.scripts]
haru-life-events = "haru_life_events.tunnel_events_local:main"

[tool.setuptools.packages.find]
include = ["haru_life_events*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
